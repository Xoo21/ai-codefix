<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI CodeFix — เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Syne', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
        },
      },
    }
  </script>

  <style>
    body {
      background: #020617;
      color: #f8fafc;
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Animated background grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Glowing orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
    }
    .orb-1 { width: 500px; height: 500px; background: #3b82f6; top: -150px; left: -100px; animation: float1 12s ease-in-out infinite; }
    .orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; right: -50px; animation: float2 10s ease-in-out infinite; }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-20px, -20px); }
    }

    .card {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid #1e293b;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
    }

    input {
      background: #0d1424;
      border: 1px solid #1e293b;
      color: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Syne', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    input::placeholder { color: #475569; }

    .btn-submit {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      transition: all 0.2s;
      font-family: 'Syne', sans-serif;
    }
    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(59,130,246,0.4);
    }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease-out forwards; }

    .gradient-text {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tab-btn { transition: all 0.2s; border-bottom: 2px solid transparent; }
    .tab-btn.active { border-bottom-color: #3b82f6; color: #3b82f6; }

    .error-msg { color: #ef4444; font-size: 0.8rem; }
    .success-msg { color: #10b981; font-size: 0.8rem; }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="relative z-10 w-full max-w-sm fade-up">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl mb-4" style="background:linear-gradient(135deg,#3b82f6,#8b5cf6)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold gradient-text mb-1">AI CodeFix</h1>
      <p class="text-sm" style="color:#64748b">ตรวจสอบโค้ดด้วย AI อัจฉริยะ</p>
    </div>

    <!-- Card -->
    <div class="card rounded-2xl p-6">
      <!-- Tabs -->
      <div class="flex mb-6 border-b" style="border-color:#1e293b">
        <button id="tab-login" class="tab-btn active flex-1 pb-3 text-sm font-semibold" onclick="switchTab('login')">เข้าสู่ระบบ</button>
        <button id="tab-register" class="tab-btn flex-1 pb-3 text-sm font-semibold" style="color:#64748b" onclick="switchTab('register')">สมัครสมาชิก</button>
      </div>

      <!-- Login Form -->
      <div id="form-login">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold mb-1.5 uppercase tracking-wider" style="color:#94a3b8">ชื่อผู้ใช้</label>
            <input id="login-username" type="text" placeholder="ใส่ชื่อผู้ใช้" class="w-full px-3.5 py-2.5 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5 uppercase tracking-wider" style="color:#94a3b8">รหัสผ่าน</label>
            <input id="login-password" type="password" placeholder="ใส่รหัสผ่าน" class="w-full px-3.5 py-2.5 rounded-lg text-sm" />
          </div>
          <p id="login-error" class="error-msg hidden"></p>
          <button id="btn-login" onclick="doLogin()" class="btn-submit w-full py-2.5 rounded-lg text-sm font-semibold text-white mt-1">
            เข้าสู่ระบบ
          </button>
        </div>

        <!-- Demo account hint -->
        <div class="mt-4 p-3 rounded-lg" style="background:#0d1424;border:1px solid #1e293b">
          <p class="text-xs" style="color:#64748b">💡 สมัครสมาชิกใหม่ได้ฟรี หรือใช้บัญชีทดสอบ:</p>
          <p class="text-xs font-mono mt-1" style="color:#3b82f6">demo / demo123</p>
        </div>
      </div>

      <!-- Register Form -->
      <div id="form-register" class="hidden">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold mb-1.5 uppercase tracking-wider" style="color:#94a3b8">ชื่อผู้ใช้</label>
            <input id="reg-username" type="text" placeholder="เลือกชื่อผู้ใช้" class="w-full px-3.5 py-2.5 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5 uppercase tracking-wider" style="color:#94a3b8">อีเมล</label>
            <input id="reg-email" type="email" placeholder="your@email.com" class="w-full px-3.5 py-2.5 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5 uppercase tracking-wider" style="color:#94a3b8">รหัสผ่าน</label>
            <input id="reg-password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" class="w-full px-3.5 py-2.5 rounded-lg text-sm" />
          </div>
          <p id="reg-error" class="error-msg hidden"></p>
          <button id="btn-register" onclick="doRegister()" class="btn-submit w-full py-2.5 rounded-lg text-sm font-semibold text-white mt-1">
            สมัครสมาชิก
          </button>
        </div>
      </div>
    </div>

    <p class="text-center text-xs mt-4" style="color:#334155">
      Powered by อำนวย กฤชณะ ณัฐวุฒิ
    </p>
  </div>

  <script>
    // ตรวจสอบว่า URL มี ?mode=register หรือไม่
    if (new URLSearchParams(location.search).get('mode') === 'register') {
      switchTab('register');
    }

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').className = 'tab-btn flex-1 pb-3 text-sm font-semibold ' + (isLogin ? 'active' : '');
      document.getElementById('tab-register').className = 'tab-btn flex-1 pb-3 text-sm font-semibold ' + (!isLogin ? 'active' : '');
      if (!isLogin) { document.getElementById('tab-register').style.color = '#3b82f6'; document.getElementById('tab-login').style.color = '#64748b'; }
      else { document.getElementById('tab-login').style.color = '#3b82f6'; document.getElementById('tab-register').style.color = '#64748b'; }
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-register').classList.toggle('hidden', isLogin);
    }

    async function doLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/dashboard';
        } else {
          errEl.textContent = data.message;
          errEl.classList.remove('hidden');
        }
      } catch {
        errEl.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    }

    async function doRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const errEl = document.getElementById('reg-error');
      const btn = document.getElementById('btn-register');

      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'กำลังสมัคร...';

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/dashboard';
        } else {
          errEl.textContent = data.message;
          errEl.classList.remove('hidden');
        }
      } catch {
        errEl.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'สมัครสมาชิก';
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const loginVisible = !document.getElementById('form-login').classList.contains('hidden');
        if (loginVisible) doLogin(); else doRegister();
      }
    });
  </script>
</body>
</html>
